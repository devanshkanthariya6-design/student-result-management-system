{% extends "base.html" %}
{% block content %}
<h2>Add New Student</h2>
<div class="form-box">
  <form method="POST">
    <label>Roll Number</label>
    <input type="text" name="roll_no" placeholder="e.g. R001" required>

    <label>Full Name</label>
    <input type="text" name="name" placeholder="e.g. Rahul Sharma" required>

    <label>Branch</label>
    <select name="branch">
      <option value="CSE">CSE</option>
      <option value="IT">IT</option>
      <option value="ECE">ECE</option>
      <option value="ME">ME</option>
    </select>

    <label>Year</label>
    <select name="year">
      <option value="1">1st Year</option>
      <option value="2">2nd Year</option>
      <option value="3">3rd Year</option>
      <option value="4">4th Year</option>
    </select>

    <button type="submit" class="btn btn-blue" style="width:100%;margin-top:10px">Add Student</button>
  </form>
</div>
{% endblock %}
